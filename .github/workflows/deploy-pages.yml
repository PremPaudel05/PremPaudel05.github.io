name: Deploy portfolio to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm ci

      # Portraits are deployment assets, not files distributed with the template.
      # Copies use the generic placeholder unless their owner supplies this secret.
      - name: Prepare optional portrait for deployment
        shell: bash
        env:
          PORTFOLIO_PORTRAIT_BASE64: ${{ secrets.PORTFOLIO_PORTRAIT_BASE64 }}
        run: |
          mkdir -p public/images
          portrait_path="public/images/portfolio-portrait.webp"
          if [ -n "$PORTFOLIO_PORTRAIT_BASE64" ]; then
            printf '%s' "$PORTFOLIO_PORTRAIT_BASE64" | base64 --decode > "$portrait_path"
          elif [ "$GITHUB_REPOSITORY" = "PremPaudel05/PremPaudel05.github.io" ]; then
            # Preserve the original site's already-public photo without putting
            # its bytes in the current repository or new template copies.
            curl --fail --silent --show-error --location --retry 2 \
              "https://prempaudel05.github.io/images/portfolio-portrait.webp" \
              --output "$portrait_path" || \
            curl --fail --silent --show-error --location --retry 2 \
              "https://prempaudel05.github.io/images/prem-portrait-cutout.webp" \
              --output "$portrait_path"
          else
            echo "Using the template portrait placeholder."
            exit 0
          fi
          test -s "$portrait_path"
          file --mime-type "$portrait_path" | grep -q "image/webp"
          printf '%s\n' "NEXT_PUBLIC_PORTRAIT_PATH=/images/portfolio-portrait.webp" >> "$GITHUB_ENV"

      - name: Build static site
        run: npm run build

      - name: Disable Jekyll
        run: touch out/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4